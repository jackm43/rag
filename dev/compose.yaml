name: ragbot-dev-ui

services:
  ui:
    build: .
    working_dir: /app
    ports:
      - "127.0.0.1:8788:8788"
    volumes:
      - ..:/app
      - ui-node-modules:/app/node_modules
      - ui-venv:/app/.venv
      - ui-worker-venv:/app/.venv-workers
      - ui-wrangler:/app/.wrangler
      - ui-uv-cache:/root/.cache/uv
    environment:
      DEV_UI_IN_CONTAINER: "1"
      CLOUDFLARE_INCLUDE_PROCESS_ENV: "true"
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
      CF_AIG_TOKEN:
      CLOUDFLARE_API_TOKEN:
      DISCORD_PUBLIC_KEY:
      DISCORD_BOT_TOKEN:
      GATEWAY_CONTROL_TOKEN:
      DISCORD_APPLICATION_ID:
    init: true

volumes:
  ui-node-modules:
  ui-venv:
  ui-worker-venv:
  ui-wrangler:
  ui-uv-cache:
