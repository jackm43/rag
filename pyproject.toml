[project]
name = "ragbot-worker"
version = "1.0.0"
description = "Discord bot on Cloudflare Python Workers"
requires-python = ">=3.14"
dependencies = ["discord-typings==0.9.0"]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "cryptography",
    "uv>=0.12.3",
]

[tool.pytest.ini_options]
pythonpath = ["src", "dev", "scripts"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.mypy]
python_version = "3.14"
files = ["src/ragbot", "src/entry.py"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
